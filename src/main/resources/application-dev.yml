spring:
  config:
    activate:
      on-profile: dev

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # 개발 초기엔 update, 운영 전환 시 validate로 변경 검토
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

jwt:
  secret: ${JWT_SECRET_KEY:ZGVva2l2ZXNlcnZlcnRlYW1hbmRvdGhlcnNmaWdodGluZw==} # 로컬 개발용 기본값. 실제 값은 .env로 override
  access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}

app:
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:8080}"

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true