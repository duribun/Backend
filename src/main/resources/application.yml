spring:
  # Time Zone Setup ---------------------------------------------------------
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        write-dates-as-timestamps: false

  # Run Profile Environment
  profiles:
    active: dev # 개발할 때는 dev, 배포할 때는 prod

  # Database Setup (PostgreSQL) ---------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?reWriteBatchedInserts=true&stringtype=unspecified
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: 6 # HikariCP 권장: vCPU * 2 + alpha, 인원/트래픽 늘면 조정
      minimum-idle: 6
      connection-timeout: 30000

  # Flyway ---------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true # 이미 Flyway 없이 만들어진 기존 dev DB에서도 에러 없이 인식하기 위함
    baseline-version: 2 # 현재 V2까지가 기존 dev DB의 스키마+시드 데이터와 동일하므로, 그 지점을 기준으로 baseline

# Utils Section ----------------------------------------------
app:
  # 모바일 앱 대상이라 쿠키 기반 설정 없음. 필요 시(관리자 웹 등) 이 자리에 추가.
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:8080}"
  backend-base-url: "${BACKEND_BASE_URL:http://localhost:8080}"

# 소셜 로그인 - 모바일 앱이 각 플랫폼 SDK로 발급받은 토큰을 검증하는 방식
# (oauth2-domain-task.md 참고, Spring Security의 oauth2Login 리다이렉트 플로우는 사용하지 않음)
oauth2:
  google:
    web-client-id: ${OAUTH_GOOGLE_WEB_CLIENT_ID}
  kakao:
    rest-api-key: ${OAUTH_KAKAO_REST_API_KEY}
  naver:
    client-id: ${OAUTH_NAVER_CLIENT_ID}
    client-secret: ${OAUTH_NAVER_CLIENT_SECRET}

# 한국관광공사 TourAPI 4.0 (KorService2) - map 도메인 관광지 정보 연동
tour-api:
  base-url: "${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}"
  service-key: ${TOUR_API_SERVICE_KEY:}

# AWS S3 - 여행 기록(record) 도메인 사진 업로드. 자격증명은 SDK 기본 자격증명 체인(환경변수/IAM Role) 사용
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expire-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRE_MINUTES:10}

# Swagger
springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html}
  api-docs:
    path: ${SWAGGER_JSON_PATH:/v3/api-docs}