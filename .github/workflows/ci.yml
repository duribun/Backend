name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: duribun_test
          POSTGRES_USER: duribun
          POSTGRES_PASSWORD: duribun_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duribun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: duribun_test
      DB_USERNAME: duribun
      DB_PASSWORD: duribun_test_password
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRATION_DAYS: 14
      OAUTH_GOOGLE_WEB_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_WEB_CLIENT_ID }}
      OAUTH_KAKAO_REST_API_KEY: ${{ secrets.OAUTH_KAKAO_REST_API_KEY }}
      OAUTH_NAVER_CLIENT_ID: ${{ secrets.OAUTH_NAVER_CLIENT_ID }}
      OAUTH_NAVER_CLIENT_SECRET: ${{ secrets.OAUTH_NAVER_CLIENT_SECRET }}
      TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test
        run: ./gradlew build
